# 自動部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, import-claude-project]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cards
      - run: npx tsx scripts/dev/inspect-corrupt.ts
      - name: Upload card build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: card-build-diagnostics
          path: |
            .cache/unsupported.txt
            .cache/corrupt.json
            src/data/cards.json
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the published game
        run: |
          curl --fail --location --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors --max-time 20 --output "$RUNNER_TEMP/pages-index.html" https://lucypigr.github.io/heartstone-for-gpt/
          grep -Fq '<div id="root"></div>' "$RUNNER_TEMP/pages-index.html"
          grep -Fq '<title>爐石戰記 for GPT</title>' "$RUNNER_TEMP/pages-index.html"
